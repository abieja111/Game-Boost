name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ekstrak zip terbaru
        run: |
          set -euo pipefail
          git ls-files -z -- '*.zip' | while IFS= read -r -d '' f; do
            printf '%s %s\0' "$(git log -1 --format=%ct -- "$f")" "$f"
          done | sort -z -n | while IFS= read -r -d '' entry; do
            f="${entry#* }"
            echo "Ekstrak: $f"
            unzip -oq "$f"
          done
          test -d GameTuner || { echo "Folder GameTuner tidak ditemukan di dalam zip"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: |
          cd GameTuner
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Siapkan file APK
        run: cp GameTuner/app/build/outputs/apk/debug/app-debug.apk GameTuner-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GameTuner-debug-apk
          path: GameTuner-debug.apk

      - name: Terbitkan APK ke Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}-${{ github.run_attempt }}" GameTuner-debug.apk \
            --title "Game Tuner build #${{ github.run_number }}" \
            --notes "APK debug dari commit ${{ github.sha }}" \
            --target "${{ github.sha }}"
